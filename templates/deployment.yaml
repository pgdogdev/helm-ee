apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" .Values.raft.enabled }}
metadata:
  name: {{ include "pgdog-control.control.fullname" . }}
  labels:
    {{- include "pgdog-control.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary 3 (int (.Values.control.replicas | default 1)) .Values.raft.enabled }}
  {{- if .Values.raft.enabled }}
  serviceName: {{ include "pgdog-control.raft.fullname" . }}
  # Start all members without waiting for an initial quorum to become ready.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      name: raft
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if eq .Values.raft.persistence.storageClass "-" }}
      storageClassName: ""
      {{- else if .Values.raft.persistence.storageClass }}
      storageClassName: {{ .Values.raft.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.raft.persistence.size | quote }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pgdog-control.selectorLabels" . | nindent 6 }}
  {{- if not .Values.raft.enabled }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  {{- end }}
  template:
    metadata:
      annotations:
        meta.helm.sh/release-name: {{ .Release.Name | quote }}
        meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
        # Roll the workload when any rendered config / secret content
        # changes. Each annotation hashes the *template output*, not
        # values directly, so transformations applied inside the
        # template (defaults, lookups, randAlphaNum on first install)
        # are accounted for. Chart-scoped keys avoid colliding with
        # `kubectl rollout restart`'s `kubectl.kubernetes.io/restartedAt`
        # under server-side apply.
        #
        # `checksum/config` covers control.toml — which includes the
        # rendered `cookie_secret` — so auth/secret rotation already
        # falls under this hash.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.control.aws.accessKeyId }}
        # AWS creds live in their own Secret, mounted via envFrom, so a
        # config change there wouldn't otherwise propagate to running
        # pods.
        checksum/aws-creds: {{ include (print $.Template.BasePath "/aws-secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "pgdog-control.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.raft.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "pgdog-control.selectorLabels" . | nindent 18 }}
      {{- else if gt (int (.Values.control.replicas | default 1)) 1 }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            {{- include "pgdog-control.selectorLabels" . | nindent 12 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.control.rbac.create }}
      serviceAccountName: {{ include "pgdog-control.control.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.control.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: control
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.control.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: CONTROL_CONFIG
          value: /etc/pgdog-control/control.toml
        {{- if .Values.raft.enabled }}
        # control2 extracts the StatefulSet ordinal from the pod name.
        - name: RAFT_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- end }}
        - name: HOME
          value: /var/lib/pgdog-control
        - name: XDG_CACHE_HOME
          value: /var/lib/pgdog-control/.cache
        - name: XDG_CONFIG_HOME
          value: /var/lib/pgdog-control/.config
        - name: XDG_DATA_HOME
          value: /var/lib/pgdog-control/.local/share
        - name: HELM_CACHE_HOME
          value: /var/lib/pgdog-control/helm/cache
        - name: HELM_CONFIG_HOME
          value: /var/lib/pgdog-control/helm/config
        - name: HELM_DATA_HOME
          value: /var/lib/pgdog-control/helm/data
        # The control plane uses these to look up the Service that fronts
        # this pod (src/models/deployment/kube/whoami.rs); without them
        # endpoint() falls back to the host.minikube.internal dev URL.
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- with .Values.control.aws.region }}
        - name: AWS_REGION
          value: {{ . | quote }}
        {{- end }}
        {{- $auth := (.Values.control.config | default dict).auth | default dict }}
        {{- with $auth.secret }}
        {{- if .cookieSecretKey }}
        - name: COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ required "control.config.auth.secret.name is required when cookieSecretKey is set" .name | quote }}
              key: {{ .cookieSecretKey | quote }}
        {{- end }}
        {{- end }}
        {{- with ((.Values.control.config | default dict).alerts | default dict).incident_io }}
        {{- with .secret }}
        {{- if .apiKeyKey }}
        - name: INCIDENT_IO_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ required "control.config.alerts.incident_io.secret.name is required when apiKeyKey is set" .name | quote }}
              key: {{ .apiKeyKey | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.raft.enabled }}
        {{- with .Values.raft.secret }}
        {{- if .tokenKey }}
        - name: RAFT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ required "raft.secret.name is required when tokenKey is set" .name | quote }}
              key: {{ .tokenKey | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.redis.secret }}
        {{- if .urlKey }}
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: {{ required "redis.secret.name is required when urlKey is set" .name | quote }}
              key: {{ .urlKey | quote }}
        {{- end }}
        {{- end }}
        {{- with $auth.github }}
        {{- with .secret }}
        # OAuth credentials sourced from an existing Secret. The control
        # plane reads these env vars as defaults when the matching field is
        # absent from control.toml (enterprise/control2/src/config.rs).
        {{- if .clientIdKey }}
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ required "control.config.auth.github.secret.name is required when clientIdKey is set" .name | quote }}
              key: {{ .clientIdKey | quote }}
        {{- end }}
        {{- if .clientSecretKey }}
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ required "control.config.auth.github.secret.name is required when clientSecretKey is set" .name | quote }}
              key: {{ .clientSecretKey | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with $auth.google }}
        {{- with .secret }}
        {{- if .clientIdKey }}
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ required "control.config.auth.google.secret.name is required when clientIdKey is set" .name | quote }}
              key: {{ .clientIdKey | quote }}
        {{- end }}
        {{- if .clientSecretKey }}
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ required "control.config.auth.google.secret.name is required when clientSecretKey is set" .name | quote }}
              key: {{ .clientSecretKey | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.control.aws.accessKeyId }}
        envFrom:
        - secretRef:
            name: {{ include "pgdog-control.control.fullname" . }}-aws-creds
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/pgdog-control
          readOnly: true
        - name: runtime
          mountPath: /var/lib/pgdog-control
        {{- if .Values.raft.enabled }}
        - name: raft
          mountPath: {{ .Values.raft.persistence.mountPath | quote }}
        {{- end }}
        - name: tmp
          mountPath: /tmp
        ports:
        - containerPort: {{ .Values.control.port }}
          name: http
        resources:
          requests:
            memory: {{ .Values.control.resources.requests.memory | quote }}
            cpu: {{ .Values.control.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.control.resources.limits.memory | quote }}
            cpu: {{ .Values.control.resources.limits.cpu | quote }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.control.port }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.control.port }}
          initialDelaySeconds: 30
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 1
      volumes:
      - name: config
        configMap:
          name: {{ include "pgdog-control.control.fullname" . }}-config
          items:
          - key: control.toml
            path: control.toml
      - name: runtime
        emptyDir: {}
      - name: tmp
        emptyDir: {}
