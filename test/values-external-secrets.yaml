control:
  externalSecrets:
    enabled: true
    create: true
    secretStoreRef:
      name: aws-secrets-manager
      kind: SecretStore
    remoteRefs:
      - secretKey: cookie_secret
        remoteRef:
          key: pgdog/control
          property: cookie_secret
  config:
    auth:
      redirect_base_url: https://control.example.com
